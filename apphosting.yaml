# ─── Firebase App Hosting configuration ──────────────────────────────────────
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Keep at 0 for hobby/low-traffic — cold starts are fine, no idle cost.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── Firebase Client SDK (public) ──────────────────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAkbT2wuHj7agnwAEavcV3cDsiTKkyKXEs
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: nasty-n8-dashboard.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: nasty-n8-dashboard
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: nasty-n8-dashboard.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "945340689456"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:945340689456:web:54e599aac9af7e370151f5
    availability:
      - BUILD
      - RUNTIME

  # ── Firebase Admin SDK (private — served via Secret Manager) ─────────────
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: nasty-n8-dashboard
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@nasty-n8-dashboard.iam.gserviceaccount.com
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key   # create in Secret Manager (see README)
    availability:
      - RUNTIME

  # ── Notifications (private — served via Secret Manager) ──────────────────
  - variable: NOTIFY_EMAIL_TO
    value: nastyn8plays@gmail.com
    availability:
      - RUNTIME
  - variable: NOTIFY_EMAIL_FROM
    value: nastyn8plays@gmail.com
    availability:
      - RUNTIME
  # NOTIFY_EMAIL_PASS deferred — email off at launch (Discord covers alerts; the
  # submit route skips email when the password is absent). To enable: create the
  # notify-email-pass secret with a Gmail app password, then uncomment this block.
  # - variable: NOTIFY_EMAIL_PASS
  #   secret: notify-email-pass
  #   availability:
  #     - RUNTIME
  - variable: DISCORD_WEBHOOK_URL
    secret: discord-webhook-url          # create in Secret Manager
    availability:
      - RUNTIME

  # ── reCAPTCHA v3 (v2.6) — ENABLE AS A PAIR ───────────────────────────────
  # reCAPTCHA is all-or-nothing: the public site key (inlined at BUILD) and the
  # server secret must both be real and present, or both absent. Half-enabling
  # breaks the live form (client sends no/invalid token, server rejects every
  # submit). Until then, honeypot + IP rate-limit + length checks guard the form.
  # To activate: create the v3 key at google.com/recaptcha/admin/create (add your
  # App Hosting domain + localhost), create the recaptcha-secret-key secret, then
  # uncomment BOTH entries below and set the real site key value.
  # - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
  #   value: your-recaptcha-v3-site-key
  #   availability:
  #     - BUILD
  #     - RUNTIME
  # - variable: RECAPTCHA_SECRET_KEY
  #   secret: recaptcha-secret-key
  #   availability:
  #     - RUNTIME

  # ── Weekly recap cron auth (Cloud Scheduler Bearer token) ────────────────
  # Admin UI button works without this; only the cron/Bearer path needs it.
  # Referenced secret must exist in Secret Manager before deploy, or the
  # rollout fails. Create with: firebase apphosting:secrets:set recap-secret
  - variable: RECAP_SECRET
    secret: recap-secret
    availability:
      - RUNTIME

  # ── Site URL — set this AFTER first deploy once you have the App Hosting URL ─
  # Example: https://nasty-n8-dashboard--default.web.app
  # This ensures Discord/email deep-links point to the live domain, not an
  # internal Cloud Run hostname.
  # - variable: SITE_URL
  #   value: https://your-app-hosting-url.web.app
  #   availability:
  #     - RUNTIME
