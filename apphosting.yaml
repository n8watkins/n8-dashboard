# ─── Firebase App Hosting configuration ──────────────────────────────────────
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Keep at 0 for hobby/low-traffic — cold starts are fine, no idle cost.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── Firebase Client SDK (public) ──────────────────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAkbT2wuHj7agnwAEavcV3cDsiTKkyKXEs
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: nasty-n8-dashboard.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: nasty-n8-dashboard
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: nasty-n8-dashboard.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "945340689456"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:945340689456:web:54e599aac9af7e370151f5
    availability:
      - BUILD
      - RUNTIME

  # ── Firebase Admin SDK (private — served via Secret Manager) ─────────────
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: nasty-n8-dashboard
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@nasty-n8-dashboard.iam.gserviceaccount.com
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key   # create in Secret Manager (see README)
    availability:
      - RUNTIME

  # ── Notifications (private — served via Secret Manager) ──────────────────
  - variable: NOTIFY_EMAIL_TO
    value: nastyn8plays@gmail.com
    availability:
      - RUNTIME
  - variable: NOTIFY_EMAIL_FROM
    value: nastyn8plays@gmail.com
    availability:
      - RUNTIME
  # NOTIFY_EMAIL_PASS deferred — email off at launch (Discord covers alerts; the
  # submit route skips email when the password is absent). To enable: create the
  # notify-email-pass secret with a Gmail app password, then uncomment this block.
  # - variable: NOTIFY_EMAIL_PASS
  #   secret: notify-email-pass
  #   availability:
  #     - RUNTIME
  - variable: DISCORD_WEBHOOK_URL
    secret: discord-webhook-url          # create in Secret Manager
    availability:
      - RUNTIME

  # ── reCAPTCHA Enterprise (v2.6) ──────────────────────────────────────────
  # Score-based (invisible). Server verification uses the Firebase Admin service
  # account credential — no separate secret key needed.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6Ld0_gQtAAAAAB5mKmgZghxY_XSxELpJuPAx0H-N
    availability:
      - BUILD
      - RUNTIME

  # ── Weekly recap cron auth (Cloud Scheduler Bearer token) ────────────────
  # Admin UI button works without this; only the cron/Bearer path needs it.
  # Referenced secret must exist in Secret Manager before deploy, or the
  # rollout fails. Create with: firebase apphosting:secrets:set recap-secret
  - variable: RECAP_SECRET
    secret: recap-secret
    availability:
      - RUNTIME

  # ── Site URL — ensures Discord/email deep-links point to the live domain ─────
  - variable: SITE_URL
    value: https://nasty-n8-dashboard--nasty-n8-dashboard.us-east4.hosted.app
    availability:
      - RUNTIME
